<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>Retro Kart World Mode</title>
    <link
      rel="stylesheet"
      href="https://ajax.googleapis.com/ajax/libs/cesiumjs/1.105/Build/Cesium/Widgets/widgets.css"
    />
    <link rel="stylesheet" href="/src/world/world.css" />
  </head>
  <body>
    <div id="world"></div>

    <div class="world-hud" aria-live="polite">
      <div class="world-hud__title">RETRO KART // WORLD MODE</div>
      <div class="world-hud__grid">
        <span>LAT</span><strong id="hud-lat">51.50550</strong>
        <span>LON</span><strong id="hud-lon">-0.07540</strong>
        <span>HEADING</span><strong id="hud-heading">0°</strong>
        <span>SPEED</span><strong id="hud-speed">0 km/h</strong>
      </div>
      <div class="world-hud__controls">WASD / arrows to drive · Space to brake</div>
    </div>

    <div id="world-error" class="world-error" hidden></div>

    <script src="https://ajax.googleapis.com/ajax/libs/cesiumjs/1.105/Build/Cesium/Cesium.js"></script>
    <script type="module" src="/src/world/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Retro Kart</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #game {
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <div id="game"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
